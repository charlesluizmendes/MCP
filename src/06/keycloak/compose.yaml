name: Keycloak
services:
  keycloak:
    container_name: Keycloak
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8086:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Defina KEYCLOAK_ADMIN_PASSWORD no ambiente}
      KC_HOSTNAME: http://127.0.0.1:8086
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?Defina OAUTH_CLIENT_SECRET no ambiente}
      MCP_SERVER_URL: ${MCP_SERVER_URL:?Defina MCP_SERVER_URL no ambiente}
    volumes:
      - ./novadrive-realm.json:/opt/keycloak/data/import/novadrive-realm.json:ro
